<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome 6 (免费版本) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Alpine.js (轻量响应式) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- 保留原有 index.css 链接，但内联重写实现玻璃卡片效果；同时仍保留外链以防其他依赖，实际样式以内联为主 -->
    <link rel="stylesheet" type="text/css" href="/index.css">
    <title>51Neo-V2 · 玻璃浅蓝</title>
    <style>
        /* 完全重写样式：玻璃卡片 + 浅蓝色调 + 半透明 + 保留原有比例 (卡片宽度比例不变) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, Arial, sans-serif;
            background: linear-gradient(145deg, #b8e1fc 0%, #d0f0fd 100%);
            /* 浅蓝色渐变背景，模拟通透天空 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            backdrop-filter: blur(2px);
        }

        /* 玻璃卡片容器 — 保留原有比例 (宽度80% max-width 800px) */
        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px 25px;

            /* 玻璃形态：半透明白色 + 模糊 + 微光边框 */
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(0, 40, 80, 0.2), 0 8px 20px rgba(0, 30, 60, 0.1), inset 0 1px 4px rgba(255,255,255,0.8);

            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            color: #04658c;        /* 深一点的浅蓝基调 */
            font-weight: 600;
            font-size: 2.3rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(255,255,255,0.7);
        }

        h1 i {
            color: #2a93d5;
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 6px rgba(0,100,150,0.2));
        }

        /* 横排选项组 — 保留横排flex，但优化为玻璃标签 */
        .option-group {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0 10px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .option {
            flex: 1;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 500;
            color: #02547d;
            border: 1px solid transparent;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(2px);
        }

        .option i {
            font-size: 1.2rem;
            color: #2a7faa;
            opacity: 0.8;
        }

        .option.selected {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid white;
            box-shadow: 0 6px 14px rgba(0,120,210,0.25);
            color: #013c5e;
            font-weight: 600;
            border-bottom: none;  /* 移除原有下划线，用玻璃突出代替 */
        }

        .option.selected i {
            color: #04658c;
            opacity: 1;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
        }

        /* 表单项 */
        .form-group {
            margin: 25px 0 15px;
        }

        .form-group label {
            font-size: 1.2rem;
            color: #02547d;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        .form-group label i {
            margin-right: 8px;
            color: #2a8dbf;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 44px;
            outline: none;
            color: #013c5e;
            font-weight: 500;
            transition: 0.2s;
            box-shadow: 0 6px 12px rgba(0, 50, 80, 0.1);
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #72c6f7;
            box-shadow: 0 10px 22px rgba(0, 110, 180, 0.25);
        }

        .form-group input::placeholder {
            color: #568bb0;
            font-weight: 300;
            opacity: 0.8;
        }

        /* 玻璃按钮 */
        .btn {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.7);
            color: #015f94;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 48px;
            cursor: pointer;
            width: 100%;
            margin: 18px 0 12px;
            box-shadow: 0 10px 18px rgba(0, 80, 130, 0.2);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            letter-spacing: 1px;
        }

        .btn i {
            font-size: 1.4rem;
            color: #2d9cdb;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 14px 28px rgba(0, 110, 190, 0.35);
            transform: scale(1.01);
            border-color: white;
            color: #003853;
        }

        /* 结果卡片 — 默认隐藏，半透明玻璃 */
        .result {
            margin-top: 30px;
            text-align: center;
            display: none;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 12px 28px rgba(0,30,50,0.2);
        }

        .result .name {
            font-weight: 700;
            font-size: 2rem;
            color: #014165;
            margin: 16px 0 10px;
            text-shadow: 2px 2px 6px rgba(255,255,255,0.6);
        }

        /* 照片 — 保留原有强制宽高比例 319x480 */
        #user-photo {
            width: 319px;
            height: 480px;
            object-fit: cover;
            border-radius: 32px;
            box-shadow: 0 20px 30px rgba(0, 50, 70, 0.3);
            border: 3px solid rgba(255,255,255,0.7);
            background: #d9ecfb;
            transition: transform 0.2s;
        }
        #user-photo:hover {
            transform: scale(1.02);
        }

        /* 用户信息 grid — 半透明卡片风格 */
        .user-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 25px;
        }

        .user-info div {
            padding: 16px 12px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.7);
            font-size: 1rem;
            color: #013c5e;
            text-align: left;
            box-shadow: 0 6px 12px rgba(0,40,60,0.1);
            transition: all 0.1s;
        }

        .user-info div span {
            font-weight: 700;
            color: #01273b;
            display: inline-block;
            min-width: 70px;
        }

        .user-info div i {
            margin-right: 8px;
            color: #2a7faa;
            width: 22px;
        }

        /* footer 透明/浅色 */
        footer {
            color: #385f78;
            text-align: center;
            padding: 18px 0 8px;
            width: 100%;
            background: transparent;
            margin-top: 20px;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(255,255,255,0.5);
        }

        footer p {
            margin: 5px 0;
        }

        footer i {
            margin: 0 4px;
            color: #2c789b;
        }

        /* GitHub 连接（新增） */
        .github-corner {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 999;
        }
        .github-corner svg {
            fill: #1d6f9c;
            color: #e1f2fe;
            width: 80px;
            height: 80px;
            border: 0;
            opacity: 0.85;
            transition: 0.2s;
        }
        .github-corner:hover svg {
            fill: #0a4b6e;
            color: white;
            opacity: 1;
        }
        .github-corner .octo-arm {
            transform-origin: 130px 106px;
        }
        .github-corner:hover .octo-arm {
            animation: octocat-wave 560ms ease-in-out;
        }
        @keyframes octocat-wave {
            0%,100% { transform: rotate(0); }
            20%,60% { transform: rotate(-25deg); }
            40%,80% { transform: rotate(10deg); }
        }

        /* 响应式优化 */
        @media (max-width: 600px) {
            .container { width: 95%; padding: 20px; }
            .option-group { flex-wrap: wrap; }
            .user-info { grid-template-columns: 1fr; }
            #user-photo { width: 100%; height: auto; aspect-ratio: 319/480; }
        }
    </style>
</head>
<body>
    <!-- GitHub 连接 (jijingxing/51neo-v2) 固定角标，玻璃风格适配 -->
    <div class="github-corner">
        <a href="https://github.com/jijingxing/51neo-v2" target="_blank" rel="noopener" aria-label="GitHub jijingxing/51neo-v2">
            <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#1d6f9c; color:#ddf0fe; position: absolute; top: 0; right: 0; border: 0;" aria-hidden="true">
                <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
                <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
                <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
            </svg>
        </a>
    </div>

    <!-- 使用 Alpine.js 管理状态：查询类型、输入、结果展示（可选但保留原逻辑，仅增加一点响应式提示） -->
    <div class="container" x-data="{ tab: 'uinlookup', page: 'search' }" x-init="() => { 
        // 同步 history API 示例：初始化时若URL有参数则进行设置(扩展)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('tab')) {
            tab = urlParams.get('tab');
            // 触发对应选项高亮 (通过原selectOption)
            const targetId = tab;
            const opt = document.getElementById(targetId);
            if (opt) selectOption(opt);
        }
        // 监听popstate处理前进后退 (简单演示)
        window.addEventListener('popstate', (event) => {
            const params = new URLSearchParams(window.location.search);
            const newTab = params.get('tab') || 'uinlookup';
            const targetEl = document.getElementById(newTab);
            if(targetEl) selectOption(targetEl);
        });
    }">
        <h1>
            <i class="fas fa-cloud-sun"></i> 51Neo-V2 
            <i class="fas fa-water" style="font-size:1.8rem;"></i>
        </h1>

        <!-- 横排单列选项 (玻璃) 嵌入了Font Awesome图标 -->
        <div class="form-group">
            <div class="option-group">
                <div class="option" id="uinlookup" onclick="selectOption(this)">
                    <i class="fas fa-qrcode"></i> <span>通讯码</span>
                </div>
                <div class="option" id="namesearch" onclick="selectOption(this)">
                    <i class="fas fa-font"></i> <span>名字查询</span>
                </div>
                <div class="option" id="uuidlookup" onclick="selectOption(this)">
                    <i class="fas fa-id-card"></i> <span>UUID查询</span>
                </div>
            </div>
        </div>

        <!-- 动态提示与输入框 加入Font Awesome图标 -->
        <div class="form-group">
            <label id="tip" for="code">
                <i class="fas fa-magnifying-glass" id="tip-icon"></i> 请输入通讯码：
            </label>
            <input type="text" id="code" placeholder="请输入通讯码：" required>
        </div>

        <!-- 玻璃按钮，带搜索图标 -->
        <button class="btn" onclick="getUserInfo()">
            <i class="fas fa-circle-nodes"></i> 查询信息 <i class="fas fa-arrow-right"></i>
        </button>

        <!-- 结果区域保持原结构，但已经通过CSS玻璃化 -->
        <div class="result" id="result">
            <img id="user-photo" src="" alt="大头照" onerror="this.src='https://via.placeholder.com/319x480?text=No+Image'">
            <p class="name" id="user-name"></p>
            <div class="user-info" id="user-info"></div>
        </div>
    </div>

    <footer>
        <p><i class="fas fa-laptop-code"></i> 仅用于技术交流，不对一切可能的滥用负责任。 <i class="fas fa-shield-halved"></i></p>
        <p>© Copyright 2025 鸡景行. All rights reserved. | <a href="https://github.com/jijingxing/51neo-v2" style="color:#2a6d8f; text-decoration: none;"><i class="fab fa-github"></i> jijingxing/51neo-v2</a></p>
    </footer>

    <script>
        // 保留原有所有逻辑，确保功能不变，同时将查询类型名变量保持一致
        var searchTypeNames = ["通讯码", "名字", "UUID"];
        var searchTypes = ["uinlookup", "namesearch", "uuidlookup"];
        var currect_searchTypeName = searchTypeNames[0];
        var currect_searchType = 0;

        // 更新图标 (根据类型微调)
        function updateTipIcon(typeIdx) {
            const iconEl = document.getElementById('tip-icon');
            if (!iconEl) return;
            const icons = ['fa-qrcode', 'fa-font', 'fa-id-card'];
            iconEl.className = `fas ${icons[typeIdx] || 'fa-magnifying-glass'}`;
        }

        function selectOption(optionElement) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));

            currect_searchType = searchTypes.indexOf(optionElement.id);
            currect_searchTypeName = searchTypeNames[currect_searchType];

            document.getElementById("tip").innerHTML = `<i class="fas ${currect_searchType === 0 ? 'fa-qrcode' : (currect_searchType === 1 ? 'fa-font' : 'fa-id-card')}" id="tip-icon"></i> 请输入${currect_searchTypeName}：`;
            document.getElementById("code").placeholder = `请输入${currect_searchTypeName}：`;

            optionElement.classList.add('selected');

            // 使用history API更新URL参数 (tab=xxx&page=search)
            const url = new URL(window.location);
            url.searchParams.set('tab', optionElement.id);
            url.searchParams.set('page', 'search');
            window.history.pushState({ tab: optionElement.id }, '', url);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 从URL初始化tab
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam && searchTypes.includes(tabParam)) {
                const targetOpt = document.getElementById(tabParam);
                if (targetOpt) selectOption(targetOpt);
            } else {
                document.getElementById('uinlookup').classList.add('selected');
                // 同时也设置history初始状态(可选)
                const url = new URL(window.location);
                if (!urlParams.has('tab')) {
                    url.searchParams.set('tab', 'uinlookup');
                    url.searchParams.set('page', 'search');
                    window.history.replaceState({ tab: 'uinlookup' }, '', url);
                }
            }
            // 确保提示图标正确
            updateTipIcon(currect_searchType);
        });

        // 后端接口函数 - 更新为使用v2 API
        async function getUserInfo() {
            const code = document.getElementById('code').value;
            if (!code) {
                alert('请输入查询内容');
                return;
            }
            try {
                // 调用v2 API
                const userInfo = await getUserInfoFromV2(code);
                displayUserInfo(userInfo);
            } catch (error) {
                alert('无法连接到服务器');
                console.error(error);
            }
        }

        async function getUserInfoFromV2(value) {
            // 根据当前查询类型决定API参数
            let queryType = "id"; // 默认通讯码查询
            if (currect_searchType === 1) {
                queryType = "name"; // 名字查询
            }
            // UUID查询暂不实现 (currect_searchType === 2)

            const apiUrl = `/api/v2/lookup?type=${encodeURIComponent(queryType)}&value=${encodeURIComponent(value)}`;
            const response = await fetch(apiUrl, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            return await response.json();
        }

        function displayUserInfo(data) {
            if (data && data.statusCode === 200) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('user-photo').src = data.picUrl || '';
                document.getElementById('user-name').textContent = data.name || '未知';

                const infoDiv = document.getElementById('user-info');
                infoDiv.innerHTML = `
                    <div><i class="fas fa-people-group"></i> <span>班级：</span>${data.classes || ''}</div>
                    <div><i class="fas fa-layer-group"></i> <span>年级：</span>${data.yearClass || ''}</div>
                    <div><i class="fas fa-person-walking"></i> <span>外宿生类型：</span>${data.tacticsType || ''}</div>
                    <div><i class="fas fa-calendar-check"></i> <span>考勤分组：</span>${data.board || ''}</div>
                    <div><i class="fas fa-graduation-cap"></i> <span>学籍状态：</span>${data.cardStatus || ''}</div>
                    <div><i class="fas fa-pen"></i> <span>备注：</span>${data.remark || '无'}</div>
                `;
            } else {
                alert('未能获取用户信息，请检查' + currect_searchTypeName);
            }
        }
    </script>
    <!-- 确保如果结果图片加载失败显示占位，已加onerror -->
</body>
</html>
